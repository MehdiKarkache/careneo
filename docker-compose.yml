# Toute la plateforme : `docker compose up --build`, puis http://localhost:8080
# Développement : `docker compose up -d db` démarre PostgreSQL seul (voir README).
name: careneo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careneo
      POSTGRES_PASSWORD: careneo
      POSTGRES_DB: careneo
    ports:
      - "127.0.0.1:5432:5432" # accessible depuis la machine seulement
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careneo -d careneo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://careneo:careneo@db:5432/careneo
      JWT_SECRET: ${JWT_SECRET:-demo-secret-a-remplacer-en-production-0123456789}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
