# Configuration des outils. Les dépendances sont dans requirements.txt / requirements-dev.txt
# (installables tels quels dans l'image Docker, avec un cache de couche efficace).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Le code contient du français (apostrophes typographiques, guillemets « ») : pas d'alerte dessus.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"] # la base de test est configurée avant d'importer l'application
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
# Le dossier alembic/ du projet ne doit pas faire passer la bibliothèque pour un module local.
known-third-party = ["alembic"]
